<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="startScreen">
        <img src="imgs/title.png" alt="Snake logo">
        
        <div id="startInfo">
            <p> Insert your name here ⬇️ </p>
            <input id="nameInput" type="text" placeholder="Javier, for example..." maxlength="12"> <!-- Le pongo un máximo de caracteres para que no se me salga el nombre de la pantalla-->
            <button id="startButton" type="button">START</button>
        </div>
        

    </div>


    <div id="canvas" class="stop">
        <canvas id="game"></canvas>
        <canvas id="score"></canvas>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/elements/body.js"></script>
    <script src="js/elements/snake.js"></script>
    <script src="js/elements/apple.js"></script>
    <script src="js/elements/enemies.js"></script>
    <script src="js/game.js"></script>
    <script src="js/score/scoreboard.js"></script>
    <script src="js/index.js"></script>

</body>
</html>
